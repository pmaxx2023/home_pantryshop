<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
  <title>PantryShop</title>
  <meta name="theme-color" content="#d8c6a4">
  <link rel="manifest" href="/wall.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/wall.css">
</head>
<body>

  <div class="wall" id="main">
    <aside class="rail">
      <div class="brand">PantryShop</div>
      <nav class="lists" id="lists"></nav>
      <button class="newlist" id="newList">+ New list</button>
      <div class="code">Open anywhere with code<br><b id="code"></b></div>
    </aside>

    <header class="head">
      <div class="title">
        <h1 id="listName">Grocery</h1>
        <div class="count" id="count">nothing to get</div>
      </div>
      <button class="btn-add" id="openPantry"><span class="plus">+</span> Add</button>
      <div class="clock" id="clock"></div>
    </header>

    <section class="board" id="board"></section>

    <footer class="foot">
      <div class="again">Buy again</div>
      <div class="chips" id="recent"></div>
      <button class="btn-clear" id="clear" disabled>Clear checked</button>
    </footer>
  </div>

  <div class="pantry" id="pantry" hidden>
    <div class="bar">
      <input id="search" placeholder="Type to find or add anything" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button class="typed" id="addTyped" hidden></button>
      <button class="btn-done" id="closePantry">Done</button>
    </div>
    <div class="jump" id="jump"></div>
    <div class="shelves" id="shelves"></div>
  </div>

  <div class="sheet-bg" id="itemSheet" hidden>
    <div class="sheet">
      <h3 id="sTitle">Item</h3>
      <div class="two">
        <div class="field"><label>Name</label><input id="sName"></div>
        <div class="field"><label>How many</label>
          <div class="stepper"><button id="sMinus">−</button><input id="sQty" placeholder="any"><button id="sPlus">+</button></div>
        </div>
      </div>
      <div class="field"><label>Note</label><input id="sNote" placeholder="the green one, from Costco, for Friday"></div>
      <div class="two">
        <div class="field"><label>Aisle</label><select id="sAisle"></select></div>
        <div class="field"><label>List</label><select id="sList"></select></div>
      </div>
      <div class="toggles">
        <button class="tog" id="sFav">☆ Favorite</button>
        <button class="tog" id="sWeekly">↻ Every week</button>
      </div>
      <div class="actions">
        <button class="danger" id="sDelete">Delete</button>
        <button id="sCancel">Cancel</button>
        <button class="primary" id="sSave">Save</button>
      </div>
    </div>
  </div>

  <div class="sheet-bg" id="listSheet" hidden>
    <div class="sheet">
      <h3 id="lTitle">New list</h3>
      <div class="field"><label>Name</label><input id="lName" placeholder="Costco, Hardware, Party"></div>
      <div class="field"><label>Icon</label><div class="icons" id="lIcons"></div></div>
      <div class="actions">
        <button class="danger" id="lDelete">Delete</button>
        <button id="lCancel">Cancel</button>
        <button class="primary" id="lSave">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden><span id="toastText"></span><button id="undo">Undo</button></div>

  <div class="night" id="night" hidden><div><div class="t" id="nightClock"></div><div class="s">Tap to wake</div></div></div>

  <div class="start hidden" id="start">
    <div class="card">
      <h1>PantryShop</h1>
      <p>The grocery list, on the kitchen wall.</p>
      <button class="big primary" id="startNew">Start a new list</button>
      <input id="joinCode" placeholder="or enter a code" maxlength="8" autocapitalize="characters" autocomplete="off">
      <button class="big" id="joinBtn">Show that list</button>
    </div>
  </div>

  <div class="status" id="status" hidden></div>

  <script type="module" src="/wall.js"></script>
</body>
</html>
